<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0A09">
<title>Aspas · cardápio em 3D</title>
<meta name="description" content="Veja o prato em 3D e coloque ele na sua mesa. Sem instalar nada.">

<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=Schibsted+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    /* carvão e brasa — a paleta é a da casa, não a minha */
    --coal:#0C0A09;      /* carvão apagado, preto quente */
    --ash:#17130F;       /* superfície elevada */
    --bone:#F4EFE9;      /* texto principal, branco quente */
    --smoke:#948880;     /* texto secundário */
    --ember:#E2551D;     /* brasa viva */
    --flame:#F0A32C;     /* o miolo amarelo do carvão */
    --hair:rgba(244,239,233,.11);
    --r:18px;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;background:var(--coal)}

  body{
    background:var(--coal);
    color:var(--bone);
    font-family:"Schibsted Grotesk",system-ui,sans-serif;
    font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  .wrap{max-width:560px;margin:0 auto;padding:0 22px}

  :focus-visible{outline:2px solid var(--flame);outline-offset:3px;border-radius:5px}

  .mono{
    font-family:"JetBrains Mono",monospace;
    font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  }

  /* ============ abertura: o fogo ============ */
  .hero{
    position:relative;
    height:clamp(340px,58vh,520px);
    overflow:hidden;
    background:#1a0f08;
  }
  .hero img{
    position:absolute;inset:0;
    width:100%;height:100%;object-fit:cover;
    /* a foto nasce escura e clareia na entrada */
    opacity:0;transform:scale(1.06);
    animation:acender 1.5s cubic-bezier(.2,.7,.2,1) .1s forwards;
  }
  @keyframes acender{to{opacity:1;transform:scale(1)}}

  /* o fogo se apaga na borda inferior e vira o fundo da página */
  .hero::after{
    content:"";position:absolute;inset:0;
    background:
      linear-gradient(to bottom,
        rgba(12,10,9,.55) 0%,
        rgba(12,10,9,.10) 26%,
        rgba(12,10,9,.72) 72%,
        var(--coal) 100%);
  }
  .heroMarca{
    position:absolute;left:0;right:0;bottom:26px;z-index:2;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    padding:0 22px;
  }
  .heroMarca img{
    /* anula a animação do <img> de fundo */
    position:static;width:auto;height:44px;opacity:1;transform:none;animation:none;
    filter:drop-shadow(0 3px 14px rgba(0,0,0,.6));
  }
  .heroMarca .lugar{color:var(--bone);opacity:.72}

  /* ============ aviso de demonstração ============ */
  .aviso{
    border-bottom:1px solid var(--hair);
    padding:15px 0 14px;
    display:flex;align-items:center;gap:9px;
    color:var(--flame);
  }
  .aviso::before{
    content:"";width:5px;height:5px;border-radius:50%;
    background:var(--flame);flex:0 0 auto;
    box-shadow:0 0 9px 1px rgba(240,163,44,.55);
  }
  .aviso:empty{display:none}

  /* ============ a tese ============ */
  .tese{padding:44px 0 6px}
  .tese h1{
    font-family:"Fraunces",Georgia,serif;
    font-variation-settings:"SOFT" 40,"WONK" 1,"opsz" 120;
    font-weight:600;
    font-size:clamp(38px,11.5vw,54px);
    line-height:.98;letter-spacing:-.028em;
  }
  .tese h1 em{font-style:normal;color:var(--ember)}
  .tese p{
    color:var(--smoke);margin-top:18px;max-width:33ch;font-size:16.5px;
  }

  /* ============ o palco ============ */
  .palco{
    position:relative;margin-top:30px;
    border-radius:var(--r);
    background:var(--ash);
    border:1px solid var(--hair);
    overflow:hidden;isolation:isolate;
  }
  /* a brasa: acende quando o prato entra em cena */
  .palco::before{
    content:"";position:absolute;z-index:0;
    left:50%;top:46%;transform:translate(-50%,-50%);
    width:125%;aspect-ratio:1/1;
    background:radial-gradient(circle,
      rgba(226,85,29,.42) 0%,
      rgba(226,85,29,.16) 32%,
      rgba(226,85,29,0) 64%);
    opacity:.18;
    transition:opacity 1.4s cubic-bezier(.3,.7,.3,1);
    pointer-events:none;
  }
  .palco.aceso::before{opacity:1}
  /* sombra de contato: o prato pousa na página */
  .palco::after{
    content:"";position:absolute;z-index:1;
    left:50%;bottom:15%;transform:translateX(-50%);
    width:54%;height:24px;border-radius:50%;
    background:radial-gradient(ellipse,rgba(0,0,0,.7) 0%,rgba(0,0,0,0) 70%);
    pointer-events:none;
  }
  .palco model-viewer{
    position:relative;z-index:2;
    width:100%;aspect-ratio:1/1;
    background:transparent;--poster-color:transparent;
    transition:opacity .3s ease;
  }
  .palco.trocando model-viewer{opacity:0}

  .carregando{
    position:absolute;inset:0;z-index:3;display:grid;place-content:center;
    color:var(--smoke);pointer-events:none;
    opacity:0;transition:opacity .22s ease;
  }
  .palco.trocando .carregando{opacity:1}

  /* ============ chamada de AR ============ */
  .ar{
    display:block;width:100%;margin-top:13px;padding:19px;
    appearance:none;border:0;cursor:pointer;
    font-family:"Schibsted Grotesk",system-ui,sans-serif;
    font-weight:700;font-size:18px;letter-spacing:-.005em;
    color:#14090A;background:var(--ember);
    border-radius:14px;
    box-shadow:0 18px 38px -20px rgba(226,85,29,.95);
    transition:transform .14s ease,box-shadow .14s ease;
  }
  .ar:active{transform:scale(.988);box-shadow:0 9px 22px -18px rgba(226,85,29,.95)}
  .ar[hidden]{display:none}
  .dica{color:var(--smoke);text-align:center;margin-top:12px}

  /* ============ o prato em foco ============ */
  .foco{margin-top:38px}
  .foco .linha{
    display:flex;align-items:baseline;gap:16px;
    padding-bottom:11px;border-bottom:1px solid var(--hair);
  }
  .foco h2{
    font-family:"Fraunces",Georgia,serif;
    font-variation-settings:"SOFT" 40,"WONK" 1,"opsz" 60;
    font-weight:500;font-size:24px;line-height:1.15;letter-spacing:-.015em;
    flex:1 1 auto;
  }
  .foco .preco{
    font-family:"JetBrains Mono",monospace;font-size:14px;
    color:var(--flame);flex:0 0 auto;font-variant-numeric:tabular-nums;
  }
  .foco .preco:empty{display:none}
  .foco .desc{color:var(--smoke);margin-top:13px;max-width:44ch}
  .foco .fonte{
    color:var(--smoke);opacity:.6;margin-top:14px;
    line-height:1.7;letter-spacing:.09em;max-width:40ch;
  }
  .foco .fonte:empty{display:none}

  /* ============ o preparo ============ */
  .preparo{margin-top:40px}
  .preparo[hidden]{display:none}
  .preparo .linha{padding-bottom:11px;border-bottom:1px solid var(--hair)}
  .preparo h2{
    font-family:"Fraunces",Georgia,serif;
    font-variation-settings:"SOFT" 40,"WONK" 1,"opsz" 60;
    font-weight:500;font-size:24px;letter-spacing:-.015em;
  }
  .preparo .quadro{
    margin-top:16px;border-radius:var(--r);overflow:hidden;
    background:#000;border:1px solid var(--hair);line-height:0;
  }
  .preparo video{
    display:block;width:100%;height:auto;max-height:72vh;
    object-fit:contain;background:#000;
  }

  /* ============ o cardápio ============ */
  .cardapio{margin-top:38px}
  .cardapio .cap{color:var(--smoke);display:block;margin-bottom:4px}
  .cardapio button{
    display:flex;align-items:baseline;gap:13px;width:100%;
    appearance:none;background:none;border:0;cursor:pointer;text-align:left;
    padding:16px 2px;border-bottom:1px solid var(--hair);
    color:var(--smoke);
    font-family:"Schibsted Grotesk",system-ui,sans-serif;font-size:16px;
    transition:color .2s ease;
  }
  .cardapio .nm{flex:1 1 auto}
  .cardapio .pr{
    font-family:"JetBrains Mono",monospace;font-size:11px;
    letter-spacing:.09em;text-transform:uppercase;opacity:.7;
  }
  .cardapio .brasa{
    width:6px;height:6px;border-radius:50%;background:currentColor;
    flex:0 0 auto;opacity:.3;transform:translateY(-3px);
    transition:opacity .2s ease,box-shadow .2s ease,background .2s ease;
  }
  .cardapio button:hover{color:var(--bone)}
  .cardapio button.espera{cursor:default;opacity:.4}
  .cardapio button.espera:hover{color:var(--smoke)}
  .cardapio button[aria-current="true"]{color:var(--bone)}
  .cardapio button[aria-current="true"] .brasa{
    background:var(--ember);opacity:1;box-shadow:0 0 10px 2px rgba(226,85,29,.6);
  }

  /* ============ assinatura ============ */
  .assina{
    margin-top:52px;padding:26px 0 46px;border-top:1px solid var(--hair);
  }
  .assina .rotulo{color:var(--smoke)}
  .assina .quem{
    font-family:"Fraunces",Georgia,serif;
    font-variation-settings:"SOFT" 40,"WONK" 1,"opsz" 60;
    font-weight:500;font-size:22px;letter-spacing:-.015em;
    color:var(--bone);margin-top:5px;
  }
  /* contorno, não preenchido: o botão de AR continua sendo o principal */
  .assina .contato{
    display:inline-flex;align-items:center;gap:10px;
    margin-top:20px;padding:14px 20px;
    border:1px solid rgba(226,85,29,.55);border-radius:13px;
    color:var(--bone);text-decoration:none;
    font-size:15.5px;font-weight:500;
    transition:background .2s ease,border-color .2s ease;
  }
  .assina .contato svg{color:var(--ember);flex:0 0 auto}
  .assina .contato:hover{background:rgba(226,85,29,.1);border-color:var(--ember)}

  /* ============ entrada ============ */
  .sobe{opacity:0;transform:translateY(13px);animation:sobe .7s cubic-bezier(.2,.7,.2,1) forwards}
  .a1{animation-delay:.5s} .a2{animation-delay:.6s} .a3{animation-delay:.7s}
  @keyframes sobe{to{opacity:1;transform:none}}

  @media (prefers-reduced-motion:reduce){
    .sobe,.hero img{animation:none;opacity:1;transform:none}
    .palco::before{transition:none;opacity:1}
    .palco model-viewer,.carregando{transition:none}
  }
</style>

<header class="hero">
  <!-- src fixo para o navegador começar a baixar antes do JS;
       CONFIG.hero sobrescreve se o cliente for outro -->
  <img id="heroImg" src="imagens/brasa.jpg" alt="" fetchpriority="high">
  <div class="heroMarca">
    <img id="bLogo" alt="" hidden>
    <strong id="bBrand"></strong>
    <span class="mono lugar" id="bPlace"></span>
  </div>
</header>

<div class="wrap">

  <p class="mono aviso" id="demoNote"></p>

  <section class="tese sobe a1">
    <h1>Do fogo<br>para a <em>sua mesa</em>.</h1>
    <p>O prato que você está pensando em pedir, em 3D — e do tamanho real, em cima da sua mesa.</p>
  </section>

  <div class="palco sobe a2" id="palco">
    <div class="mono carregando">carregando</div>
    <model-viewer
      id="mv"
      camera-controls
      auto-rotate
      auto-rotate-delay="1400"
      rotation-per-second="16deg"
      interaction-prompt="none"
      environment-image="neutral"
      exposure="1.1"
      shadow-intensity="1.2"
      shadow-softness="0.9"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-scale="fixed"
      alt="Modelo 3D do prato">
    </model-viewer>
  </div>

  <button class="ar sobe a2" id="arBtn">Ver na sua mesa</button>
  <p class="mono dica sobe a2" id="arHint">aponte a câmera para a mesa</p>

  <section class="foco sobe a3" aria-live="polite">
    <div class="linha">
      <h2 id="fName">—</h2>
      <span class="preco" id="fPrice"></span>
    </div>
    <p class="desc" id="fDesc"></p>
    <p class="mono fonte" id="fFonte"></p>
  </section>

  <section class="preparo" id="preparo" hidden>
    <div class="linha">
      <h2>Como é feito</h2>
    </div>
    <div class="quadro">
      <video id="prepVideo" controls playsinline preload="none"></video>
    </div>
  </section>

  <nav class="cardapio" aria-label="Cardápio">
    <span class="mono cap">cardápio</span>
    <div id="railList"></div>
  </nav>

  <footer class="assina">
    <p class="mono rotulo">experiência criada por</p>
    <p class="quem" id="sWho"></p>
    <a class="contato" id="sLink" href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true" width="19" height="19">
        <path fill="currentColor" d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm0 18.15h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24a8.2 8.2 0 0 1 5.83 2.42 8.2 8.2 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23Zm4.52-6.17c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.24-.64.8-.78.97-.15.16-.29.18-.53.06-.25-.13-1.05-.39-1.99-1.23-.74-.66-1.24-1.47-1.38-1.72-.15-.25-.02-.38.1-.5.11-.11.25-.29.37-.44.13-.15.17-.25.25-.42.09-.16.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.42h-.47c-.16 0-.43.06-.65.31-.22.25-.85.84-.85 2.03 0 1.2.87 2.35.99 2.51.12.17 1.71 2.61 4.15 3.66.58.25 1.03.4 1.39.51.58.19 1.11.16 1.53.1.47-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.15-1.18-.06-.11-.22-.17-.47-.29Z"/>
      </svg>
      <span>Quero um no meu restaurante</span>
    </a>
  </footer>

</div>

<script>
/* ============================================================
   CONFIG — é só isto que muda de cliente para cliente.
   ============================================================ */
const CONFIG = {
  brand: "Aspas",
  place: "Praia Brava · Itajaí",

  hero: "imagens/brasa.jpg",          // foto de abertura, 1400px, ~250 KB
  logo: "marca/aspas-logo.png",       // PNG claro com transparência

  // Faixa de aviso no topo. Vazio = some. A assinatura do rodapé
  // já identifica quem fez a página.
  demoNote: "",

  // Vídeo do preparo. Peça o arquivo bruto ao restaurante e salve
  // como video/preparo.mp4 — assim ele entra dentro deste design, em
  // vez da moldura branca do embed do Instagram. Vazio = seção some.
  video: "",
  videoPoster: "",

  studio: "Mateus Eleuterio",
  whatsapp: "5547999171043",          // 55 + DDD 47 + 99917-1043
  pitch: "Vi a demonstração do cardápio em 3D e quero conversar.",

  // Nomes, descrições e preços vêm do cardápio que o próprio Aspas
  // publica no Linktree. Nada aqui é inventado.
  items: [
    {
      name: "Tiradito de peixe branco maçaricado",
      price: "R$ 86",
      desc: "Peixe do dia maturado, manteiga noisette, amêndoas defumadas, queijo fresco pomerode, mostarda na brasa e molho ponzu.",
      fonte: "Modelo 3D gerado a partir da foto publicada no site do restaurante.",
      glb: "modelos/aspas-peixe.glb",
      usdz: ""                        // opcional: melhora o AR no iPhone
    },
    { name: "Polvo no espeto",             price: "R$ 129", pending: true },
    { name: "Moqueca de camarão e peixe",  price: "R$ 359", pending: true },
    { name: "Arroz negro de polvo",        price: "R$ 379", pending: true }
  ]
};

/* ============================================================ */

const mv     = document.getElementById('mv');
const palco  = document.getElementById('palco');
const arBtn  = document.getElementById('arBtn');
const arHint = document.getElementById('arHint');
const rail   = document.getElementById('railList');

document.getElementById('bBrand').textContent = CONFIG.brand;
document.getElementById('bPlace').textContent = CONFIG.place;
document.getElementById('sWho').textContent   = CONFIG.studio;
document.getElementById('heroImg').src        = CONFIG.hero;
document.title = CONFIG.brand + " · cardápio em 3D";

// com logo, o nome em texto fica só para tecnologia assistiva
if (CONFIG.logo) {
  const img = document.getElementById('bLogo');
  img.src = CONFIG.logo;
  img.alt = CONFIG.brand;
  img.hidden = false;
  const txt = document.getElementById('bBrand');
  txt.style.cssText =
    'position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)';
}

// a seção do preparo só existe quando há vídeo de verdade
if (CONFIG.video) {
  const v = document.getElementById('prepVideo');
  v.src = CONFIG.video;
  if (CONFIG.videoPoster) v.poster = CONFIG.videoPoster;
  document.getElementById('preparo').hidden = false;
}

const note = document.getElementById('demoNote');
if (CONFIG.demoNote) note.textContent = CONFIG.demoNote;
else note.remove();

const link = document.getElementById('sLink');
link.href   = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(CONFIG.pitch);
link.target = "_blank";
link.rel    = "noopener";

let atual = -1;

function mostrar(i){
  if (i === atual) return;
  const item = CONFIG.items[i];
  atual = i;

  palco.classList.add('trocando');
  mv.addEventListener('load',  () => palco.classList.remove('trocando'), { once:true });
  mv.addEventListener('error', () => palco.classList.remove('trocando'), { once:true });

  mv.src = item.glb;
  if (item.usdz) mv.setAttribute('ios-src', item.usdz);
  else mv.removeAttribute('ios-src');
  mv.alt = item.name + " em 3D";

  document.getElementById('fName').textContent  = item.name;
  document.getElementById('fPrice').textContent = item.price || "";
  document.getElementById('fDesc').textContent  = item.desc  || "";
  document.getElementById('fFonte').textContent = item.fonte || "";

  [...rail.children].forEach((b, n) =>
    b.setAttribute('aria-current', n === i ? 'true' : 'false'));
}

CONFIG.items.forEach((item, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.innerHTML = '<span class="brasa"></span><span class="nm"></span><span class="pr"></span>';
  b.querySelector('.nm').textContent = item.name;

  if (item.pending) {
    // ainda sem modelo: não finge que existe
    b.querySelector('.pr').textContent = "em produção";
    b.disabled = true;
    b.classList.add('espera');
  } else {
    b.querySelector('.pr').textContent = item.price || "";
    b.addEventListener('click', () => mostrar(i));
  }
  rail.appendChild(b);
});

mostrar(0);

/* a brasa acende quando o prato entra em cena — o único momento
   coreografado da página */
if ('IntersectionObserver' in window) {
  new IntersectionObserver((entradas, obs) => {
    entradas.forEach(e => {
      if (e.isIntersecting) { palco.classList.add('aceso'); obs.disconnect(); }
    });
  }, { threshold:.35 }).observe(palco);
} else {
  palco.classList.add('aceso');
}

/* AR só existe se o aparelho suportar — some em vez de falhar */
mv.addEventListener('load', () => {
  const ok = mv.canActivateAR;
  arBtn.hidden = !ok;
  arHint.textContent = ok
    ? "aponte a câmera para a mesa"
    : "abra no celular para ver na sua mesa";
}, { once:true });

arBtn.addEventListener('click', () => mv.activateAR());
</script>
