<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071A1C">
<title>Maré Alta · cardápio em 3D</title>
<meta name="description" content="Veja o prato em 3D e coloque ele na sua mesa. Sem instalar nada.">

<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
  :root{
    /* fundo frio, luz quente — só duas temperaturas na página inteira */
    --abyss:#071A1C;
    --tide:#0E2C30;
    --foam:#E8F2EF;
    --haze:#7FA3A0;
    --ember:#FF7A2F;
    --salt:#F2C879;

    --edge:rgba(232,242,239,.10);
    --r:20px;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;background:var(--abyss)}

  body{
    background:var(--abyss);
    color:var(--foam);
    font-family:"Newsreader",Georgia,serif;
    font-weight:300;
    font-size:16.5px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  .wrap{max-width:540px;margin:0 auto;padding:0 22px 64px}

  :focus-visible{outline:2px solid var(--ember);outline-offset:3px;border-radius:6px}

  /* ---------- marca ---------- */
  .brand{
    display:flex;align-items:center;gap:9px;
    padding:24px 0 4px;
    font-family:"JetBrains Mono",monospace;
    font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--haze);
  }
  .brand .lamp{
    width:7px;height:7px;border-radius:50%;
    background:var(--ember);
    box-shadow:0 0 12px 2px rgba(255,122,47,.65);
    flex:0 0 auto;
  }
  .brand strong{color:var(--foam);font-weight:600}
  .brand .sep{opacity:.4}
  /* logo do cliente, quando houver: substitui o nome em texto */
  .brand .logo{height:26px;width:auto;display:block;flex:0 0 auto}
  .brand .logo[hidden]{display:none}

  /* ---------- abertura ---------- */
  .open{padding:30px 0 22px}
  .open .kicker{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--salt);display:block;margin-bottom:14px;
  }
  .open .kicker:empty{display:none}
  .open h1{
    font-family:"Bricolage Grotesque",system-ui,sans-serif;
    font-weight:800;font-size:clamp(32px,9vw,44px);line-height:1.0;
    letter-spacing:-.025em;
  }
  .open p{
    color:var(--haze);margin-top:12px;max-width:34ch;font-size:16px;
  }

  /* ---------- o palco: poça de luz ---------- */
  .stage{
    position:relative;margin-top:26px;
    border-radius:var(--r);
    background:var(--tide);
    border:1px solid var(--edge);
    overflow:hidden;
    isolation:isolate;
  }
  /* a luz — único gradiente da página */
  .stage::before{
    content:"";position:absolute;z-index:0;
    left:50%;top:44%;transform:translate(-50%,-50%);
    width:118%;aspect-ratio:1/1;
    background:radial-gradient(circle,
      rgba(255,122,47,.34) 0%,
      rgba(255,122,47,.13) 34%,
      rgba(255,122,47,0) 66%);
    transition:opacity .5s ease;
    pointer-events:none;
  }
  /* sombra de contato: o prato pousa na página */
  .stage::after{
    content:"";position:absolute;z-index:1;
    left:50%;bottom:16%;transform:translateX(-50%);
    width:52%;height:26px;border-radius:50%;
    background:radial-gradient(ellipse,rgba(3,10,11,.72) 0%,rgba(3,10,11,0) 70%);
    pointer-events:none;
  }
  .stage model-viewer{
    position:relative;z-index:2;
    width:100%;aspect-ratio:1/1;
    background:transparent;
    --poster-color:transparent;
    transition:opacity .32s ease;
  }
  .stage.swapping model-viewer{opacity:0}

  .loading{
    position:absolute;inset:0;z-index:3;display:grid;place-content:center;
    font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--haze);
    pointer-events:none;opacity:0;transition:opacity .25s ease;
  }
  .stage.swapping .loading{opacity:1}

  /* ---------- chamada para AR ---------- */
  .ar{
    display:block;width:100%;margin-top:14px;padding:18px;
    appearance:none;border:0;cursor:pointer;
    font-family:"Bricolage Grotesque",system-ui,sans-serif;
    font-weight:700;font-size:17px;letter-spacing:-.01em;
    color:#2A0E00;background:var(--ember);
    border-radius:15px;
    box-shadow:0 16px 34px -18px rgba(255,122,47,.9);
    transition:transform .14s ease,box-shadow .14s ease;
  }
  .ar:active{transform:scale(.987);box-shadow:0 8px 20px -16px rgba(255,122,47,.9)}
  .ar[hidden]{display:none}

  .arhint{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;letter-spacing:.05em;color:var(--haze);
    text-align:center;margin-top:11px;
  }

  /* ---------- item em foco ---------- */
  .focus{margin-top:34px}
  .focus .top{
    display:flex;align-items:baseline;gap:14px;
    border-bottom:1px solid var(--edge);padding-bottom:10px;
  }
  .focus h2{
    font-family:"Bricolage Grotesque",system-ui,sans-serif;
    font-weight:700;font-size:25px;line-height:1.12;letter-spacing:-.02em;
    flex:1 1 auto;
  }
  .focus .price{
    font-family:"JetBrains Mono",monospace;font-weight:600;font-size:15px;
    color:var(--salt);flex:0 0 auto;font-variant-numeric:tabular-nums;
  }
  .focus .desc{
    color:var(--haze);margin-top:12px;font-size:16.5px;max-width:44ch;
  }

  /* ---------- trilha do cardápio ---------- */
  .rail{margin-top:34px}
  .rail .cap{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--haze);margin-bottom:6px;display:block;
  }
  .rail button{
    display:flex;align-items:baseline;gap:12px;width:100%;
    appearance:none;background:none;border:0;cursor:pointer;text-align:left;
    padding:15px 2px;
    border-bottom:1px solid var(--edge);
    color:var(--haze);
    font-family:"Newsreader",Georgia,serif;font-size:16.5px;font-weight:300;
    transition:color .2s ease;
  }
  .rail button .nm{flex:1 1 auto}
  .rail button .pr{
    font-family:"JetBrains Mono",monospace;font-size:13px;
    font-variant-numeric:tabular-nums;opacity:.75;
  }
  .rail button .lamp{
    width:6px;height:6px;border-radius:50%;background:currentColor;
    flex:0 0 auto;opacity:.35;transform:translateY(-3px);
    transition:opacity .2s ease,box-shadow .2s ease,background .2s ease;
  }
  .rail button.pending{cursor:default;opacity:.45}
  .rail button.pending:hover{color:var(--haze)}
  .rail button.pending .pr{font-style:normal;letter-spacing:.06em;font-size:11px;text-transform:uppercase}
  .rail button[aria-current="true"]{color:var(--foam)}
  .rail button[aria-current="true"] .lamp{
    background:var(--ember);opacity:1;
    box-shadow:0 0 10px 2px rgba(255,122,47,.6);
  }
  .rail button:hover{color:var(--foam)}

  /* ---------- rodapé / assinatura ---------- */
  .sign{
    margin-top:46px;padding-top:20px;border-top:1px solid var(--edge);
    display:flex;align-items:flex-end;justify-content:space-between;gap:18px;
  }
  .sign p{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;line-height:1.7;letter-spacing:.04em;color:var(--haze);
  }
  .sign a{color:var(--foam);text-decoration:none;border-bottom:1px solid var(--ember)}
  .sign .who{color:var(--foam)}

  /* ---------- entrada ---------- */
  .rise{opacity:0;transform:translateY(12px);animation:rise .62s cubic-bezier(.2,.7,.2,1) forwards}
  .d1{animation-delay:.06s} .d2{animation-delay:.14s} .d3{animation-delay:.22s}
  @keyframes rise{to{opacity:1;transform:none}}

  @media (prefers-reduced-motion:reduce){
    .rise{animation:none;opacity:1;transform:none}
    .stage model-viewer,.stage::before,.loading{transition:none}
  }
</style>

<div class="wrap">

  <div class="brand">
    <span class="lamp"></span>
    <img id="bLogo" class="logo" alt="" hidden>
    <strong id="bBrand">Maré Alta</strong>
    <span class="sep">/</span>
    <span id="bPlace">Praia Brava</span>
  </div>

  <header class="open rise">
    <span class="kicker" id="demoNote"></span>
    <h1>O prato antes<br>de pedir.</h1>
    <p>Toque num item para ver em 3D. Depois coloque ele na sua mesa, do tamanho real.</p>
  </header>

  <div class="stage rise d1" id="stage">
    <div class="loading">carregando</div>
    <model-viewer
      id="mv"
      camera-controls
      auto-rotate
      auto-rotate-delay="1200"
      rotation-per-second="18deg"
      interaction-prompt="none"
      environment-image="neutral"
      exposure="1.05"
      shadow-intensity="1.25"
      shadow-softness="0.85"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-scale="fixed"
      alt="Modelo 3D do prato">
    </model-viewer>
  </div>

  <button class="ar rise d1" id="arBtn">Ver na sua mesa</button>
  <p class="arhint" id="arHint">aponte a câmera para a mesa</p>

  <section class="focus rise d2" aria-live="polite">
    <div class="top">
      <h2 id="fName">—</h2>
      <span class="price" id="fPrice"></span>
    </div>
    <p class="desc" id="fDesc"></p>
  </section>

  <nav class="rail rise d3" aria-label="Cardápio">
    <span class="cap">cardápio</span>
    <div id="railList"></div>
  </nav>

  <footer class="sign">
    <p>experiência feita por<br><span class="who" id="sWho">Seu Estúdio</span></p>
    <p><a id="sLink" href="#">quero no meu<br>restaurante</a></p>
  </footer>

</div>

<script>
/* ============================================================
   CONFIG — é só isto que muda de cliente para cliente.
   Troque marca, itens e o link do rodapé. Nada mais abaixo
   precisa ser tocado.
   ============================================================ */
const CONFIG = {
  brand: "Aspas",
  place: "Praia Brava · Itajaí",

  // Logo do cliente (PNG com transparência, claro). Vazio = usa o
  // nome em texto. O arquivo veio do site do próprio restaurante.
  logo: "marca/aspas-logo.png",

  // Aviso obrigatório enquanto a página não for autorizada pelo
  // restaurante. Deixe vazio ("") só depois que o cliente fechar.
  demoNote: "demonstração — não é o cardápio oficial do Aspas",

  // assinatura do rodapé
  studio: "Seu Estúdio",
  whatsapp: "5547999999999",          // só números, com DDI 55
  pitch: "Vi a demonstração do cardápio em 3D e quero conversar.",

  // Sem preços: não invente valores de um restaurante real.
  // Preencha "price" só com a tabela que o próprio cliente passar.
  items: [
    {
      name: "Peixe selado, purê e amêndoas",
      price: "",
      desc: "Modelo 3D gerado a partir da foto publicada no site do Aspas. É este o resultado que entra para cada prato do cardápio.",
      glb: "modelos/aspas-peixe.glb",
      usdz: ""                        // opcional: .usdz melhora o AR no iPhone
    },
    { name: "Polvo na brasa",  price: "", pending: true },
    { name: "Spritz da casa",  price: "", pending: true },
    { name: "Sobremesa",       price: "", pending: true }
  ]
};

/* ============================================================ */

const mv     = document.getElementById('mv');
const stage  = document.getElementById('stage');
const arBtn  = document.getElementById('arBtn');
const arHint = document.getElementById('arHint');
const rail   = document.getElementById('railList');

document.getElementById('bBrand').textContent = CONFIG.brand;
document.getElementById('bPlace').textContent = CONFIG.place;

// com logo, o nome em texto vira apenas leitura para tecnologia assistiva
if (CONFIG.logo) {
  const img = document.getElementById('bLogo');
  img.src = CONFIG.logo;
  img.alt = CONFIG.brand;
  img.hidden = false;
  const txt = document.getElementById('bBrand');
  txt.style.position = 'absolute';
  txt.style.width = '1px';
  txt.style.height = '1px';
  txt.style.overflow = 'hidden';
  txt.style.clip = 'rect(0 0 0 0)';
}
document.getElementById('sWho').textContent   = CONFIG.studio;
document.title = CONFIG.brand + " · cardápio em 3D";

const note = document.getElementById('demoNote');
if (CONFIG.demoNote) note.textContent = CONFIG.demoNote;
else note.remove();

const link = document.getElementById('sLink');
link.href = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(CONFIG.pitch);
link.target = "_blank";
link.rel = "noopener";

let current = -1;

function show(i){
  if (i === current) return;
  const item = CONFIG.items[i];
  current = i;

  stage.classList.add('swapping');

  mv.addEventListener('load', () => stage.classList.remove('swapping'), { once:true });
  mv.addEventListener('error', () => stage.classList.remove('swapping'), { once:true });

  mv.src = item.glb;
  if (item.usdz) mv.setAttribute('ios-src', item.usdz);
  else mv.removeAttribute('ios-src');
  mv.alt = item.name + " em 3D";

  document.getElementById('fName').textContent  = item.name;
  document.getElementById('fPrice').textContent = item.price || "";
  document.getElementById('fDesc').textContent  = item.desc || "";

  [...rail.children].forEach((b, n) =>
    b.setAttribute('aria-current', n === i ? 'true' : 'false'));
}

CONFIG.items.forEach((item, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.innerHTML =
    '<span class="lamp"></span>' +
    '<span class="nm"></span>' +
    '<span class="pr"></span>';
  b.querySelector('.nm').textContent = item.name;

  if (item.pending) {
    // ainda sem modelo: não finge que existe
    b.querySelector('.pr').textContent = "em produção";
    b.disabled = true;
    b.classList.add('pending');
  } else {
    b.querySelector('.pr').textContent = item.price || "";
    b.addEventListener('click', () => show(i));
  }
  rail.appendChild(b);
});

show(0);

/* AR só existe se o aparelho suportar — some em vez de falhar. */
mv.addEventListener('load', () => {
  const ok = mv.canActivateAR;
  arBtn.hidden = !ok;
  arHint.textContent = ok
    ? "aponte a câmera para a mesa"
    : "abra no celular para ver na sua mesa";
}, { once:true });

arBtn.addEventListener('click', () => mv.activateAR());
</script>
